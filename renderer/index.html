<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>粉色 PDF 分页器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 自定义标题栏 -->
  <header class="titlebar">
    <div class="titlebar-left">
      <svg class="app-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="3" fill="#F4A0C0"/>
        <path d="M7 9h10M7 13h6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>粉色 PDF 分页器</span>
    </div>
    <div class="titlebar-right">
      <button id="btn-minimize" class="title-btn" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-close" class="title-btn close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- 主区域（阶段 1 占位，阶段 2 替换为完整界面） -->
  <main class="placeholder">
    <svg class="placeholder-icon" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <circle cx="32" cy="32" r="28" fill="#FFEAF2"/>
      <rect x="18" y="17" width="28" height="30" rx="4" fill="#FFFFFF" stroke="#F4A0C0" stroke-width="2"/>
      <path d="M24 26h16M24 32h16M24 38h10" stroke="#E57CA6" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1>粉色 PDF 分页器</h1>
    <p>应用骨架已就绪，完整界面正在搭建中…</p>
    <span class="version">v0.1.0 · 阶段 1</span>
  </main>

  <script src="app.js"></script>
</body>
</html>
